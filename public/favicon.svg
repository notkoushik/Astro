<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logoGoldGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="35%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="logoCrimsonGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <radialGradient id="logoCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="55%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </radialGradient>
  </defs>

  <!-- Soft Warm Ivory Backdrop Circle so Red Rays Pop on Dark Browser Tabs -->
  <circle cx="50" cy="50" r="48" fill="#FFFFFF" />
  <circle cx="50" cy="50" r="47" stroke="url(#logoGoldGrad)" stroke-width="2" />

  <!-- 12 Radiant Astronomical Zodiac Solar Rays -->
  <g stroke="url(#logoCrimsonGrad)" stroke-width="3.2" stroke-linecap="round">
    <line x1="50" y1="5" x2="50" y2="16" />
    <line x1="50" y1="84" x2="50" y2="95" />
    <line x1="5" y1="50" x2="16" y2="50" />
    <line x1="84" y1="50" x2="95" y2="50" />
    <line x1="18" y1="18" x2="26" y2="26" />
    <line x1="74" y1="74" x2="82" y2="82" />
    <line x1="82" y1="18" x2="74" y2="26" />
    <line x1="26" y1="74" x2="18" y2="82" />
    <line x1="33" y1="9" x2="37" y2="18" stroke-width="2.4" />
    <line x1="67" y1="9" x2="63" y2="18" stroke-width="2.4" />
    <line x1="33" y1="91" x2="37" y2="82" stroke-width="2.4" />
    <line x1="67" y1="91" x2="63" y2="82" stroke-width="2.4" />
  </g>

  <!-- Outer Astrolabe Celestial Orbit Ring -->
  <circle cx="50" cy="50" r="32" stroke="url(#logoGoldGrad)" stroke-width="2.2" stroke-dasharray="3.5 2.5" />
  
  <!-- Inscribed Sacred Vedic Diamond (Kundali Geometric Frame) -->
  <rect x="28" y="28" width="44" height="44" transform="rotate(45 50 50)" stroke="url(#logoGoldGrad)" stroke-width="2" fill="none" />

  <!-- Middle Radiant Celestial Ring -->
  <circle cx="50" cy="50" r="24" stroke="url(#logoGoldGrad)" stroke-width="2.5" fill="#FFFDF5" />

  <!-- 8-Point Navagraha Planetary Star Coordinates -->
  <circle cx="50" cy="26" r="2.5" fill="#B91C1C" />
  <circle cx="50" cy="74" r="2.5" fill="#B91C1C" />
  <circle cx="26" cy="50" r="2.5" fill="#B91C1C" />
  <circle cx="74" cy="50" r="2.5" fill="#B91C1C" />
  <circle cx="33" cy="33" r="2" fill="#F59E0B" />
  <circle cx="67" cy="67" r="2" fill="#F59E0B" />
  <circle cx="67" cy="33" r="2" fill="#F59E0B" />
  <circle cx="33" cy="67" r="2" fill="#F59E0B" />

  <!-- Central Radiant Surya Sun Core -->
  <circle cx="50" cy="50" r="15" fill="url(#logoCoreGlow)" stroke="url(#logoGoldGrad)" stroke-width="2" />

  <!-- Sacred Celestial Bindu / Cosmic Spiral -->
  <path
    d="M50 42 C45.5 42 42.5 45.8 42.5 49.5 C42.5 54 46 57.5 50 57.5 C53.5 57.5 56.5 55 56.5 51.5 C56.5 49 54.5 47.5 52 47.5 C50.5 47.5 49.2 48.5 49.2 50"
    stroke="#9A3412"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
  />
  <circle cx="50" cy="50" r="2" fill="#B45309" />
</svg>
